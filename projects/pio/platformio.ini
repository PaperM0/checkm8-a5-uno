[env:uno]
; AppleTV3,1 (A1427, S5L8942)
platform = atmelavr
board = uno
framework = arduino
upload_port = COM28
upload_speed = 115200
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags = -Wl,--gc-sections

[env:ipad2]
; iPad 2 / iPhone 4S (S5L8940) — same sources, different SoC payload
platform = atmelavr
board = uno
framework = arduino
upload_port = COM28
upload_speed = 115200
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags = -Wl,--gc-sections -DA5_8940
